# Mount the dsh-prompt-optimizer server plugin when this package is registered
# as a DeepSeek Harness profile bundle. The plugin needs the agent registry (for
# `agent/pre-step`), the LLM runtime (for the auxiliary optimization request),
# the user-questions seam (for the variant-selection card), the command registry
# (for `/optimize`), and the web server (for the composer toggle's state route).
- insert:
    - id: prompt-optimizer
      name: dsh-prompt-optimizer
